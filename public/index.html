<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
<meta property="og:url" content="https://domain-checker-oh01.onrender.com/">
<meta property="og:title" content="Instant Live Domain Availability Checker">
<meta property="og:description" content="Find available domain names instantly with real-time live DNS search.">
<meta name="google-site-verification" content="IAl-_Y02MseZEODCxCqgH831ESPpMXxI7fMYECy2L70" />
    <title>Live Domain Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            flex: 1;
            min-width: 240px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            overflow: hidden;
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 16px;
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
        }

        .input-group select {
            background: #1e293b;
            color: #38bdf8;
            border: none;
            border-left: 1px solid #475569;
            padding: 0 12px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #0369a1;
        }

        button:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .result-box.available {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #34d399;
        }

        .result-box.taken {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .result-box.error {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid #f59e0b;
            color: #fbbf24;
        }

        .loader {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #38bdf8;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            margin-top: 25px;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🌐 Real Domain Checker</h1>
            <p>Live DNS & Registry status checker</p>
        </header>

        <div class="search-box">
            <div class="input-group">
                <input type="text" id="domainInput" placeholder="Enter name (e.g. google)" autocomplete="off">
                <select id="tldSelect">
                    <option value=".com">.com</option>
                    <option value=".org">.org</option>
                    <option value=".net">.net</option>
                    <option value=".io">.io</option>
                    <option value=".co">.co</option>
                </select>
            </div>
            <button id="checkBtn" onclick="checkDomain()">Check</button>
        </div>

        <div id="resultBox" class="result-box">
            <div id="loader" class="loader" style="display: none;"></div>
            <p id="resultMessage"></p>
        </div>
    </div>

    <footer>
        &copy; 2026 Ujwal web developement and creation
    </footer>

    <script>
        async function checkDomain() {
            const input = document.getElementById('domainInput').value.trim().toLowerCase();
            const tld = document.getElementById('tldSelect').value;
            const resultBox = document.getElementById('resultBox');
            const resultMessage = document.getElementById('resultMessage');
            const loader = document.getElementById('loader');

            if (!input) {
                alert('Please enter a domain name.');
                return;
            }

            const domain = input + tld;

            resultBox.className = 'result-box active';
            loader.style.display = 'inline-block';
            resultMessage.textContent = ' Querying live DNS registry...';

            try {
                // Queries Cloudflare DoH API to check for active DNS records
                const response = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=A`, {
                    headers: { 'Accept': 'application/dns-json' }
                });
                
                const data = await response.json();
                loader.style.display = 'none';

                if (data.Status === 3) {
                    // NXDOMAIN -> No active DNS records found
                    resultBox.className = 'result-box active available';
                    resultMessage.innerHTML = `🎉 <strong>${domain}</strong> appears to be AVAILABLE (No active DNS records)!`;
                } else if (data.Status === 0) {
                    // NOERROR -> Domain exists and has active records
                    resultBox.className = 'result-box active taken';
                    resultMessage.innerHTML = `❌ <strong>${domain}</strong> is TAKEN and actively registered!`;
                } else {
                    resultBox.className = 'result-box active taken';
                    resultMessage.innerHTML = `⚠️ <strong>${domain}</strong> is registered or reserved.`;
                }
            } catch (err) {
                loader.style.display = 'none';
                resultBox.className = 'result-box active error';
                resultMessage.textContent = 'Error connecting to lookup service. Check your connection.';
            }
        }
    </script>
</body>
</html>
